version: 2

sources:
  - name: retail
    database: your_bigquery_project
    schema: raw
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    loaded_at_field: _loaded_at
    tables:
      - name: raw_orders
      - name: raw_customers

models:
  - name: stg_orders
    description: "Cleaned and renamed orders from raw source."
    columns:
      - name: order_id
        description: "Primary key for orders."
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['pending', 'completed', 'cancelled']

  - name: stg_customers
    description: "Cleaned customer records from raw source."
    columns:
      - name: customer_id
        description: "Primary key for customers."
        tests:
          - not_null
          - unique
